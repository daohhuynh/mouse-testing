[package]
name = "mouse-testing"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Measurement suite for gaming mouse behaviour"
publish = false

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["glow", "default_fonts"] }
egui = "=0.35.0"
egui_extras = { version = "=0.35.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
mach2 = "=0.7.0"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = 1
